name: zikr
description: "জিকির (Zikr) - ইসলামিক জিকির রিমাইন্ডার, তসবিহ এবং নামাজের সময় অটো-পজ অ্যাপ (ডেস্কটপ ও মোবাইল)।"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  adhan: ^2.0.0+1
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  tray_manager: ^0.2.3
  window_manager: ^0.4.2
  launch_at_startup: ^0.3.1
  package_info_plus: ^8.0.2
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  file_picker: 8.1.7
  timezone: ^0.9.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
  fonts:
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: TiroBangla
      fonts:
        - asset: assets/fonts/TiroBangla-Regular.ttf
