<!DOCTYPE html>
<html lang="bn">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Zikr Companion — জিকির, তাসবিহ, দোয়া ও কুরআন তিলাওয়াত</title>
  <meta name="description" content="প্রতিদিনের জিকির, ডিজিটাল তাসবিহ, মাসনুন দোয়া, নামাজের সময়সূচি ও কুরআন তিলাওয়াতের ইসলামিক ওয়েব অ্যাপ।">
  <meta name="theme-color" content="#064e3b">

  <!-- Open Graph / Social Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zikr Companion — জিকির, তাসবিহ ও আমলের সঙ্গী">
  <meta property="og:description" content="প্রতিদিনের জিকির, ডিজিটাল তাসবিহ, মাসনুন দোয়া ও কুরআন তিলাওয়াতের আধুনিক ইসলামিক অ্যাপ।">
  <meta property="og:image" content="https://zikr.nexterp.bd/app_logo.png">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zikr Companion">
  <link rel="apple-touch-icon" href="app_logo.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at center, #047857 0%, #064e3b 55%, #022c22 100%);
    }
    #web-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: sans-serif;
      z-index: 9999;
    }
    #web-loader img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid #f59e0b;
      box-shadow: 0 0 28px rgba(245, 158, 11, 0.35);
      margin-bottom: 16px;
      object-fit: cover;
    }
    #web-loader .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    #web-loader .sub {
      font-size: 13px;
      color: #a7f3d0;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="web-loader">
    <img src="app_logo.png" alt="Zikr Companion">
    <div class="title">Zikr Companion</div>
    <div class="sub">লোড হচ্ছে...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('web-loader');
      if (loader) loader.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
